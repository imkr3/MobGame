name: Build APK

on:
  push:
    branches:
      - main
      - master
      - claude/android-mobile-game-urtv8n
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Neon Void APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # A release build is signed with a key generated for this run. It installs
      # like any normal APK, but because the key differs between runs you must
      # uninstall a previous copy before sideloading a newer one.
      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/neonvoid.jks" \
            -storepass neonvoid -keypass neonvoid \
            -alias neonvoid -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Neon Void, OU=Game, O=Neon Void, L=., ST=., C=US"

      - name: Build release APK
        env:
          NEONVOID_KEYSTORE: ${{ runner.temp }}/neonvoid.jks
          NEONVOID_KEYSTORE_PASSWORD: neonvoid
          NEONVOID_KEY_ALIAS: neonvoid
          NEONVOID_KEY_PASSWORD: neonvoid
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/neon-void-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/neon-void.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-void-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete neon-void-latest --yes --cleanup-tag || true
          gh release create neon-void-latest dist/neon-void.apk dist/neon-void-debug.apk \
            --title "Neon Void - latest build" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automatic build from \`$GITHUB_SHA\`.

          **neon-void.apk** - the one to install (release build, signed with a per-run key).
          **neon-void-debug.apk** - debug build, useful for logcat.

          Sideloading: allow installs from your browser or file manager, then open the APK.
          If an older copy is already installed, uninstall it first - each build is signed with a different key."
